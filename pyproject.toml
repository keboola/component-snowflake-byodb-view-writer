[project]
name = "component-snowflake-byodb-view-writer"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "dataconf>=3.6.0",
    "freezegun>=1.5.5",
    "kbcstorage",
    "keboola-component>=1.6.13",
    "keboola-utils>=1.1.0",
    "mock>=5.2.0",
    "snowflake-connector-python>=3.17.4",
]

[tool.uv.sources]
kbcstorage = { git = "https://github.com/keboola/sapi-python-client.git" }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ruff>=0.13.2",
]
